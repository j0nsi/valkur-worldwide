<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valkur — Boutiques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080A;--line:#202024;--ink:#EDEAE3;--ink-dim:#9A978F;--ink-mute:#5C5A55;--accent:#369D65;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased}
a{color:var(--ink-dim);text-decoration:none;transition:color .2s}a:hover{color:var(--accent)}
.page{min-height:100vh;display:grid;grid-template-rows:auto 1fr;padding:22px 48px 32px;background:radial-gradient(ellipse at center,#0E0E12 0%,var(--bg) 70%)}
nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
.back{justify-self:start;display:flex;gap:10px;align-items:center}
.logo img{height:22px;display:block}
.lang{justify-self:end;display:flex;border:1px solid var(--line);height:28px}
.lang button{appearance:none;border:0;background:transparent;color:var(--ink-mute);font-family:var(--mono);font-size:10px;letter-spacing:.2em;padding:0 12px;cursor:pointer}
.lang button.on{color:var(--accent);background:rgba(54,157,101,.08)}
main{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:28px;padding:80px 0}
.eyebrow{color:var(--ink-mute)}
h1{margin:0;font-family:var(--serif);font-weight:300;font-size:clamp(64px,11vw,168px);line-height:.95;letter-spacing:-.02em}
h1 em{color:var(--accent);font-weight:400}
p{margin:0;max-width:520px;font-size:16px;line-height:1.7;color:var(--ink-dim);text-wrap:pretty}
.rule{width:1px;height:60px;background:linear-gradient(180deg,var(--accent),transparent)}
.sites{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.sites a{border:1px solid var(--line);padding:12px 18px;color:var(--ink)}
.sites a:hover{border-color:var(--accent)}
</style>
</head>
<body>
<div class="page">
<nav>
<a class="back mono" href="index.html"><span>←</span><span data-i18n="back">Volver</span></a>
<a class="logo" href="index.html"><img src="assets/valkur-logo.png" alt="Valkur"></a>
<div class="lang"><button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button></div>
</nav>
<main>
<div class="mono eyebrow" data-i18n="eyebrow">Boutiques Valkur</div>
<h1 data-i18n-html="title">Próxima<em>mente.</em></h1>
<div class="rule"></div>
<p data-i18n="text">Estamos preparando espacios a la altura de cada pieza. Mientras tanto, puedes conocer nuestros relojes en los sitios oficiales de cada país.</p>
<div class="sites mono">
<a href="https://valkur.com.ar" target="_blank" rel="noopener">Argentina ↗</a>
<a href="https://valkur.cl" target="_blank" rel="noopener">Chile ↗</a>
<a href="https://valkur.com.pe" target="_blank" rel="noopener" data-i18n="peru">Perú ↗</a>
</div>
</main>
</div>
<div id="site-footer"></div>
<script>
const T={es:{back:'Volver',eyebrow:'Boutiques Valkur',title:'Próxima<em>mente.</em>',text:'Estamos preparando espacios a la altura de cada pieza. Mientras tanto, puedes conocer nuestros relojes en los sitios oficiales de cada país.',peru:'Perú ↗',tag:'Hecho con respeto por el tiempo'},en:{back:'Back',eyebrow:'Valkur Boutiques',title:'Coming <em>soon.</em>',text:'We are preparing spaces worthy of every piece. Meanwhile, discover our watches on the official site of each country.',peru:'Peru ↗',tag:'Crafted with respect for time'}};
function setLang(l){if(!T[l])l='es';try{localStorage.setItem('valkur.lang',l)}catch(e){}document.documentElement.lang=l;if(window.I18N&&window.I18N.lang!==l)window.I18N.set(l);document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=T[l][e.dataset.i18n]);document.querySelectorAll('[data-i18n-html]').forEach(e=>e.innerHTML=T[l][e.dataset.i18nHtml]);document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
let l='es';try{l=localStorage.getItem('valkur.lang')||'es'}catch(e){}setLang(l);
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="components/i18n.jsx"></script>
<script type="text/babel" src="components/Footer.jsx"></script>
<script type="text/babel">ReactDOM.createRoot(document.getElementById('site-footer')).render(<Footer/>);</script>
</body>
</html>
